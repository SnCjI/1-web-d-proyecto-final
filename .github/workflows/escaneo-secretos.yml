name: Escaneo de secretos

# Revisa los archivos del repositorio en cada push y cada pull request.
# Si encuentra algo con forma de credencial (API key, token, contrasena,
# llave privada), la ejecucion falla y GitHub manda un correo.
#
# La version va fijada a proposito. La etiqueta "latest" cambia sus reglas
# sin aviso: la 8.21.2, por ejemplo, todavia no reconocia las API keys de
# Anthropic (sk-ant-api03-...), que son justo las que hay que detectar.
# Para subir de version, cambia VERSION y revisa que el escaneo siga limpio.
#
# Escanea los archivos tal como estan ahora, no el historial completo,
# para no fallar por valores viejos ya corregidos.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: Buscar credenciales en el codigo
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar gitleaks
        env:
          VERSION: 8.30.0
        run: |
          curl -sSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Escanear en busca de credenciales
        run: /tmp/gitleaks detect --source . --no-git --redact --verbose --no-banner
